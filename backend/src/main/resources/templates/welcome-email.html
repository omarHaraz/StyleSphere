<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to StyleSphere</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding:30px;">

<div style="max-width:600px; margin:auto; background:white; padding:30px; border-radius:10px;">

    <h1 style="color:#007bff;">
        Welcome to StyleSphere!
    </h1>

    <p>
        Hi <strong th:text="${name}">User</strong>,
    </p>

    <p>
        Thank you for joining the <strong>StyleSphere</strong> family!
    </p>

    <p>
        Your account has been successfully created and you're ready to explore
        the latest fashion trends and discover amazing products.
    </p>

    <p>
        We hope you enjoy your experience with us.
    </p>

    <br>

    <p>
        ❤️ The StyleSphere Team
    </p>

</div>

</body>
</html>

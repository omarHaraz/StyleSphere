<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | StyleSphere</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-container">
            <div class="logo">StyleSphere</div>
        </div>

        <div id="signupFormContainer" class="login-card">
            <h2>Create account</h2>
            <p class="subtitle">Join us and get started today.</p>

            <button class="btn-google">Continue with Google</button>
            <div class="divider"><span>or</span></div>

            <form id="signupForm">
                <div class="input-container">
                    <input type="text"  id="name"  placeholder="Full Name" required>
                </div>
                <div class="input-container">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-container">
                    <input type="password" placeholder="Password" id="password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox"> Email me with news and offers
                    </label>
                </div>

                <button type="submit" class="btn-primary">Sign up</button>
            </form>
            <p class="signup-text">Already have an account? <a href="login.html">Sign in</a></p>
        </div>

        <div id="otpSection" class="login-card" style="display: none;">
            <h2>Enter code</h2>
            <p class="subtitle">Sent to <span id="displayEmail"></span> <a href="#" onclick="showSignup()">Change</a></p>
            
            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
            </div>
            <button type="button" onclick="verifyOtp()" class="btn-primary" style="margin-top: 20px;">Verify</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
